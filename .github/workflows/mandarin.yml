# Mandarin: builds Mandarin.app for Apple silicon Macs, runs the tests, and uploads the disk image, the test results and
# the screenshots the render tests take (Mandarin's wheel and panels among them).
#
# Runs on every push to main or mandarin, and from the Actions tab (Run workflow). The disk image is ad-hoc signed and
# not notarized: macOS asks once, under System Settings > Privacy & Security > Open Anyway.
name: Mandarin for macOS

on:
  push:
    branches: [main, mandarin]
  workflow_dispatch:

concurrency:
  group: mandarin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libfreetype6 libx11-6 libice6 libsm6 libxrandr2 libxkbcommon0 libxi6 libxtst6 libxt6 xvfb fonts-noto-cjk

      - name: Fonts
        run: ./build/fetch-fonts.ps1

      - name: Restore engine downloads
        uses: actions/cache@v4
        with:
          path: build/.cache/portable-downloads
          key: portable-engines-linux-x64-${{ hashFiles('src/Filee.Engines/Infrastructure/engines.json') }}

      - name: Build
        run: |
          ./build/fetch-portable-engines.ps1 -Runtime linux-x64 -Destination engines
          dotnet build Filee.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The look first: Mandarin's screenshot tests alone, published to the looks branch within minutes, so the design
      # can be reviewed before the whole suite has run.
      - name: Mandarin look screenshots
        continue-on-error: true
        run: |
          xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 dotnet test tests/Filee.App.Tests/Filee.App.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~MandarinLookTests|FullyQualifiedName~RenderTests.Main_window_pages_render|FullyQualifiedName~GlassFlipTests"

      - name: Publish look screenshots
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/looks"; mkdir -p "$out"
          cp tests/Filee.App.Tests/bin/Release/net10.0/screenshots/*.png "$out"/ 2>/dev/null || true
          cd "$out"
          git init -q && git checkout -q -b looks && git add -A
          git -c user.email=ci@mandarin -c user.name=CI commit -qm "Look screenshots from ${GITHUB_SHA::7}" --allow-empty
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" looks

      - name: Test
        id: test
        continue-on-error: true
        run: |
          $failed = @()
          foreach ($project in @('Filee.Core.Tests', 'Filee.Engines.Tests', 'Filee.Cli.Tests', 'Filee.App.Tests')) {
            $arguments = @('test', "tests/$project/$project.csproj", '--no-build', '-c', 'Release',
              '--logger', "trx;LogFileName=$project.trx", '--results-directory', 'TestResults',
              '--filter', 'FullyQualifiedName!=Filee.App.Tests.ExplorerMenuTests.Every_native_import_exists_in_the_dll_it_names&FullyQualifiedName!=Filee.App.Tests.ExplorerMenuTests.Reading_the_registered_package_never_throws')
            if ($project -eq 'Filee.App.Tests') { $arguments += @('--blame-hang-timeout', '5m') }
            xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 dotnet @arguments
            if ($LASTEXITCODE -ne 0) { $failed += $project }
          }
          if ($failed.Count -gt 0) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results-and-screenshots
          path: |
            TestResults/
            tests/Filee.App.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

      # The screenshots and a list of failed tests, on a branch of their own (screenshots), so they can be looked at
      # with git alone.
      - name: Publish screenshots and failures
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/shots"; mkdir -p "$out"
          shots=tests/Filee.App.Tests/bin/Release/net10.0/screenshots
          if [ -d "$shots" ]; then
            cp "$shots"/mandarin-*.png "$out"/ 2>/dev/null || true
            for name in page-general-en page-home-en page-theme-en page-toolbar-en; do cp "$shots/$name.png" "$out"/ 2>/dev/null || true; done
          fi
          python3 - "$out/failures.txt" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          lines = []
          for trx in sorted(glob.glob('TestResults/*.trx')):
              root = ET.parse(trx).getroot()
              for r in root.iter(ns + 'UnitTestResult'):
                  if r.get('outcome') == 'Failed':
                      msg = r.find(f'{ns}Output/{ns}ErrorInfo/{ns}Message')
                      st = r.find(f'{ns}Output/{ns}ErrorInfo/{ns}StackTrace')
                      lines.append(f"### {r.get('testName')}\n{(msg.text if msg is not None else '')[:1500]}\n{(st.text if st is not None else '')[:1200]}\n")
          open(sys.argv[1], 'w').write('\n'.join(lines) or 'No failed tests.\n')
          PY
          cd "$out"
          git init -q && git checkout -q -b screenshots && git add -A
          git -c user.email=ci@mandarin -c user.name=CI commit -qm "Screenshots and failures from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" screenshots

      - name: Fail when a test failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # The app itself: built on a Mac (the disk image and code signing need macOS). Waits for no test run, so a slow
  # queue for Mac runners doesn't hold up the tests above.
  mac:
    name: Mandarin.app (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Disk image tool
        run: python3 -m pip install -r installer/macos/dmg/requirements.txt

      - name: Fonts
        run: ./build/fetch-fonts.ps1

      - name: Restore engine downloads
        uses: actions/cache@v4
        with:
          path: build/.cache/portable-downloads
          key: portable-engines-osx-arm64-${{ hashFiles('src/Filee.Engines/Infrastructure/engines.json') }}

      - name: Build Mandarin.app and its disk image
        run: ./build/build-portable.ps1 -Runtime osx-arm64 -SkipFonts

      - name: Check the package and run its converters
        run: ./build/smoke-portable.ps1 -Runtime osx-arm64

      - name: Upload Mandarin
        uses: actions/upload-artifact@v4
        with:
          name: Mandarin-macOS-AppleSilicon
          path: |
            Releases/*-osx-arm64.dmg
            Releases/*-osx-arm64-SHA256SUMS.txt
          if-no-files-found: error
